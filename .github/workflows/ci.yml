name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check (Biome)
        run: npm run lint

      - name: Typecheck (App + Worker)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build (Vite)
        run: npm run build
